<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transit Index | North America</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="frame" class="frame">
        <header class="masthead">
            <div class="masthead-brand">
                <div class="masthead-subtitle">NORTH AMERICA</div>
                <div class="masthead-title">TRANSIT INDEX</div>
            </div>
            <div class="masthead-stats" id="masthead-stats" aria-live="polite">
                <div class="stat-block">
                    <span class="stat-value" id="stat-total">—</span>
                    <span class="stat-label">Projects</span>
                </div>
                <div class="stat-block">
                    <span class="stat-value" id="stat-construction">—</span>
                    <span class="stat-label">Building</span>
                </div>
                <div class="stat-block">
                    <span class="stat-value" id="stat-opened">—</span>
                    <span class="stat-label">Opened</span>
                </div>
                <div class="stat-block">
                    <span class="stat-value" id="stat-planning">—</span>
                    <span class="stat-label">Planned</span>
                </div>
            </div>
        </header>

        <div id="map"></div>
        <div id="loading" class="loading-banner hidden" aria-live="polite">Loading corridors…</div>

        <div class="map-controls" id="map-controls">
            <button type="button" id="explore-toggle" class="map-control-btn" aria-pressed="false" title="Allow pan and zoom">
                Explore
            </button>
            <button type="button" id="reset-view" class="map-control-btn" title="Reset map to full network">
                Reset
            </button>
        </div>

        <div id="sidebar" class="sidebar hidden">
            <div class="sidebar-sheet-handle" aria-hidden="true"></div>
            <button id="close-sidebar" class="close-btn" aria-label="Close projects panel">&times;</button>
            <div id="sidebar-content">
                <h1 id="project-name">PROJECTS</h1>
                <div id="list-view">
                    <p class="list-count" id="list-count"></p>

                    <div id="filter-container" class="filter-panel">
                        <label class="search-label" for="project-search">
                            <span class="sr-only">Search projects</span>
                            <input type="search" id="project-search" placeholder="Search name, agency, category…" autocomplete="off">
                        </label>
                        <div class="sort-row">
                            <label for="sort-select" class="sort-label">Sort</label>
                            <select id="sort-select">
                                <option value="name">A–Z</option>
                                <option value="status">Status</option>
                            </select>
                        </div>
                        <div class="status-chips" id="status-chips" role="group" aria-label="Filter by status">
                            <!-- chips injected -->
                        </div>
                    </div>

                    <div id="project-list" class="project-list"></div>
                    <p id="empty-list" class="empty-list hidden">No projects match.</p>
                </div>

                <div id="project-details-view" class="details-view hidden">
                    <div id="project-status" class="status-badge">SELECT A PROJECT</div>
                    <div class="detail-meta" id="project-meta"></div>
                    <div id="project-details" class="technical-details">
                        <p id="project-description">Click on a project to see more details.</p>
                        <div class="detail-field" id="project-timeline-field">
                            <div class="detail-field-label">Timeline</div>
                            <div id="project-timeline" class="timeline"></div>
                        </div>
                        <div id="project-milestones" class="milestones-list"></div>
                        <div class="detail-field" id="project-stations-field" hidden>
                            <div class="detail-field-label">Stations mapped</div>
                            <div id="project-stations-count" class="detail-field-value"></div>
                        </div>
                    </div>
                    <div class="button-group">
                        <a id="project-link" href="#" target="_blank" rel="noopener" class="external-link hidden">Official project page</a>
                        <button id="back-to-list" class="secondary-btn">Back to list</button>
                    </div>
                </div>
            </div>
        </div>

        <button id="open-sidebar" class="sidebar-toggle hidden">Projects</button>

        <div id="legend" class="legend hidden">
            <h4>Status</h4>
            <div class="legend-items">
                <div class="legend-item"><span class="status-planning-dot"></span> Planning</div>
                <div class="legend-item"><span class="status-approved-dot"></span> Approved</div>
                <div class="legend-item"><span class="status-construction-dot"></span> Construction</div>
                <div class="legend-item"><span class="status-opened-dot"></span> Recently opened</div>
                <div class="legend-item"><span class="status-delayed-dot"></span> Delayed</div>
            </div>
        </div>
    </div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
    <script src="app.js"></script>
</body>

</html>
