<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transit Index | North America</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="frame" class="frame">
        <header class="masthead">
            <div class="masthead-main">
                <div class="masthead-subtitle">NORTH AMERICA</div>
                <div class="masthead-title">TRANSIT INDEX</div>
            </div>
        </header>
        <div id="map"></div>

        <div id="sidebar" class="sidebar hidden">
            <button id="close-sidebar" class="close-btn">&times;</button>
            <div id="sidebar-content">
                <h1 id="project-name">PROJECTS</h1>
                <div id="filter-container" class="filter-group">
                    <select id="status-filter">
                        <option value="all">ALL STATUSES</option>
                    </select>
                </div>
                <div id="project-list" class="project-list">
                    <!-- Project list items will be injected here -->
                </div>
                <div id="project-details-view" class="details-view hidden">
                    <div id="project-status" class="status-badge">SELECT A PROJECT</div>
                    <div id="project-details" class="technical-details">
                        <p id="project-description">Click on a project to see more details.</p>
                        <div id="project-timeline" class="timeline"></div>
                        <div id="project-milestones" class="milestones-list"></div>
                    </div>
                    <div class="button-group">
                        <a id="project-link" href="#" target="_blank" class="external-link hidden">OFFICIAL PROJECT PAGE</a>
                        <button id="back-to-list" class="secondary-btn">BACK TO LIST</button>
                    </div>
                </div>
            </div>
        </div>

        <button id="open-sidebar" class="sidebar-toggle hidden">Projects</button>

        <div id="legend" class="legend hidden">
            <h4>Status</h4>
            <button type="button" class="status-toggle" data-status="planning" aria-pressed="true">
                <span class="status-planning-dot" style="background-color: #4CAF50;"></span> Planning
            </button>
            <button type="button" class="status-toggle" data-status="approved" aria-pressed="true">
                <span class="status-approved-dot" style="background-color: #2196F3;"></span> Approved
            </button>
            <button type="button" class="status-toggle" data-status="construction" aria-pressed="true">
                <span class="status-construction-dot" style="background-color: #FF9800;"></span> Construction
            </button>
            <button type="button" class="status-toggle" data-status="opened" aria-pressed="true">
                <span class="status-opened-dot" style="background-color: #ef3e42;"></span> Recently Opened
            </button>
            <button type="button" class="status-toggle" data-status="delayed" aria-pressed="true">
                <span class="status-delayed-dot" style="background-color: #F44336;"></span> Delayed
            </button>
        </div>
    </div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
    <script src="app.js"></script>
</body>

</html>
