<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transit Index | North America</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="frame" class="frame">
        <header class="masthead">
            <div class="masthead-brand">
                <div class="masthead-subtitle">NORTH AMERICA</div>
                <div class="masthead-title">TRANSIT INDEX</div>
            </div>
            <div class="masthead-tools">
                <label class="masthead-search" for="project-search">
                    <span class="sr-only">Search projects</span>
                    <input type="search" id="project-search" placeholder="Search projects…" autocomplete="off">
                </label>
                <div class="masthead-meta" id="masthead-meta" aria-live="polite">
                    <span class="masthead-count" id="stat-total">—</span>
                    <span class="masthead-count-label">projects</span>
                </div>
            </div>
        </header>

        <div id="map"></div>
        <div id="loading" class="loading-banner hidden" aria-live="polite">Loading corridors…</div>

        <div class="hud" id="hud">
            <div class="status-chips" id="status-chips" role="radiogroup" aria-label="Filter by status"></div>
        </div>

        <div id="hover-card" class="hover-card hidden" aria-hidden="true"></div>

        <div id="viewport-strip" class="viewport-strip hidden" aria-label="Projects in view">
            <div class="viewport-strip-label">In this view</div>
            <div id="viewport-chips" class="viewport-chips"></div>
        </div>

        <aside id="detail-sheet" class="detail-sheet hidden" aria-live="polite">
            <div class="detail-sheet-handle" aria-hidden="true"></div>
            <button type="button" id="close-detail" class="close-btn" aria-label="Close project details">&times;</button>
            <div class="detail-sheet-body">
                <h1 id="project-name">Project</h1>
                <div id="project-status" class="status-badge">—</div>
                <div class="detail-meta" id="project-meta"></div>
                <div class="technical-details">
                    <p id="project-description"></p>
                    <div class="detail-field">
                        <div class="detail-field-label">Timeline</div>
                        <div id="project-timeline" class="timeline"></div>
                    </div>
                    <div id="project-milestones" class="milestones-list"></div>
                    <div class="detail-field" id="project-stations-field" hidden>
                        <div class="detail-field-label">Stations mapped</div>
                        <div id="project-stations-count" class="detail-field-value"></div>
                    </div>
                </div>
                <div class="button-group">
                    <a id="project-link" href="#" target="_blank" rel="noopener" class="external-link hidden">Official project page</a>
                    <button type="button" id="clear-selection" class="secondary-btn">Back to map</button>
                </div>
            </div>
        </aside>

        <p class="map-hint" id="map-hint">Scroll the map to explore · Click a corridor for details</p>
    </div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
    <script src="app.js"></script>
</body>

</html>
